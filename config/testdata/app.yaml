app:
  name: demo
  language: en-US
  timezone: Asia/Shanghai
  debug: false
web:
  listen: 127.0.0.1:9000
db:
  driver: mysql
  dsn: root:pass@tcp(127.0.0.1:3306)/demo?charset=utf8mb4
cache:
  driver: redis
  keyPrefix: demo
  redis:
    addr: 127.0.0.1:6379
    db: 1
log:
  level: info
session:
  name: DEMOSID
  backend: redis
  timeout: 3600
