# goyii basic example — configuration values only; behavior is assembled in
# main.go (code owns behavior, yaml owns values).
#
# Every value below can be overridden through the matching environment
# variable (field path upper-cased): DB_DSN, WEB_LISTEN, WEB_HOSTINFO,
# CACHE_PATH, SESSION_PATH, APP_DEBUG, EMAIL_APIKEY, ...
#
# The active environment (GOYII_ENV, default dev) overlays this file with
# web-<env>.yaml when that file exists — see web-dev.yaml.
app:
  name: basic
  debug: true

web:
  listen: "127.0.0.1:8090"
  # The scheme-and-host prefix absolute URLs are built on (the post page's
  # permalink); main.go installs it on the url manager at boot. A value
  # without scheme or host is a boot-time wiring mistake and stops the
  # process. WEB_HOSTINFO overrides this file.
  hostInfo: "http://127.0.0.1:8090"
  # The example serves a JSON API plus CSRF-protected write requests, so the
  # convention fallback and CSRF validation both stay enabled (defaults).

db:
  driver: sqlite
  # WAL plus a busy timeout let the serve process and a queue worker (or a
  # second migrate/seed invocation) share the same sqlite file without
  # "database is locked" failures.
  dsn: runtime/basic.sqlite?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)

stats:
  # The secondary database of the multi-database walkthrough: a project-owned
  # connection assembled in main.go and registered there as the migrate
  # target "stats" (migrate --db=stats up). Its env overrides carry the yaml
  # key as prefix: STATS_DRIVER, STATS_DSN.
  driver: sqlite
  dsn: runtime/stats.sqlite?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)

queue:
  # The db driver stores messages in the queue table (created by
  # queue.NewMigration through the migrate command); workers consume them
  # with "queue run" or the resident "queue listen".
  driver: db
  tableName: queue

cache:
  driver: file
  path: runtime/cache

session:
  backend: file
  path: runtime/session

i18n:
  # Display language for requests that signal no preference; the browser
  # pages offer a per-session switch (?lang=zh-CN). The message trees are
  # embedded in the binary (messages/ in main.go), this value only picks the
  # default display side.
  language: en-US

mail:
  # log records every message in the application log (development); switch
  # to smtp for delivery (see docs/配置参考.md).
  driver: log
  from: "goyii basic <no-reply@goyii.example>"

email:
  # This project's fully custom section: the credentials of a transactional
  # mail provider, consumed by the notifier component built in main.go. No
  # framework package knows these fields. The dev overlay (web-dev.yaml)
  # replaces the key; EMAIL_APIKEY overrides both. Values here are
  # placeholders for the walkthrough — production feeds the key through the
  # environment, never through a committed file.
  apiKey: base-key-from-app-yaml
  sender: "goyii basic <notifications@goyii.example>"

log:
  level: debug
  targets:
    # Human-facing console: info and up, without query noise.
    - type: console
      minLevel: info
      except: ["db"]
    # Observability file: every database record (queries, slow queries) plus
    # the application's cache events land here.
    - type: file
      path: runtime/app.log
      minLevel: debug
      categories: ["db*", "cache"]
  gorm:
    # Demo threshold set low on purpose so ordinary queries already surface
    # as slow-query warnings in the file target.
    slowThresholdMs: 1
