# goyii advanced example — configuration values only; behavior is assembled
# in main.go (code owns behavior, yaml owns values).
#
# Every value below can be overridden through the matching environment
# variable (field path upper-cased): DB_DSN, WEB_LISTEN, WEB_HOSTINFO,
# SESSION_PATH, APP_DEBUG, ...
#
# The active environment (GOYII_ENV, default dev) overlays this file with
# web-<env>.yaml when that file exists — see web-dev.yaml. This base file
# carries the terse production-flavored values; the environments/ directory
# of the Yii2 advanced template maps onto those overlays.
app:
  name: advanced
  debug: false

web:
  listen: "127.0.0.1:8090"
  # The scheme-and-host prefix absolute URLs are built on (a post page's
  # permalink); main.go installs it on the url manager at boot. A value
  # without scheme or host is a boot-time wiring mistake and stops the
  # process. WEB_HOSTINFO overrides this file; web-prod.yaml interpolates a
  # deployment's host instead.
  hostInfo: "http://127.0.0.1:8090"
  # The backend partition's own prefix — the deployment shape where the admin
  # face runs on a domain of its own. One process serves both partitions on
  # one port here, so the base value mirrors hostInfo; a separate backend
  # domain arrives through the environment (WEB_BACKENDHOSTINFO overrides
  # this file, the same yaml-key-uppercased rule behind WEB_HOSTINFO;
  # web-prod.yaml interpolates a deployment's backend host).
  backendHostInfo: "http://127.0.0.1:8090"

db:
  driver: sqlite
  # WAL plus a busy timeout let the serve process and a second migrate
  # invocation share the same sqlite file without "database is locked"
  # failures.
  dsn: runtime/advanced.sqlite?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)

session:
  # File-backed login sessions in the app's runtime directory; the shared
  # user model resolves the stored identity ids (SESSION_PATH overrides).
  backend: file
  path: runtime/session

log:
  level: info
  gorm:
    # Queries at or above this duration log as slow; high enough that the
    # console stays quiet in ordinary runs.
    slowThresholdMs: 200
